  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tic Tac Toe Game | Anjaneyulu Portfolio</title>

  <meta name="description" content="Play Tic Tac Toe online. Built by Anjaneyulu using HTML, CSS and JavaScript. Explore my web development projects." />

  <meta name="keywords" content="tic tac toe, javascript game, HTML CSS JS project, Anjaneyulu portfolio, web development, full stack developer" />

  <link rel="canonical" href="https://anjicmrcet.online/" />

</head>

<body>
  <main class="app">

    <header>
      <h1>XOX</h1>
      <p class="subtitle">Tic Tac Toe</p>
    </header>

    <!-- Games Button -->
    <div class="actions">
      <a href="/games" class="btn primary games-btn">
        🎮 Games
      </a>
    </div>

    <section class="scoreboard" aria-label="Score">
      <div class="score x-score">
        <span class="label">X</span>
        <span id="score-x" class="value">0</span>
      </div>

      <div class="score draws">
        <span class="label">Draw</span>
        <span id="score-draw" class="value">0</span>
      </div>

      <div class="score o-score">
        <span class="label">O</span>
        <span id="score-o" class="value">0</span>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">
      X's turn
    </p>

    <div id="board" class="board" role="grid" aria-label="Game board">
      <button type="button" class="cell" data-index="0" aria-label="Cell 1"></button>
      <button type="button" class="cell" data-index="1" aria-label="Cell 2"></button>
      <button type="button" class="cell" data-index="2" aria-label="Cell 3"></button>
      <button type="button" class="cell" data-index="3" aria-label="Cell 4"></button>
      <button type="button" class="cell" data-index="4" aria-label="Cell 5"></button>
      <button type="button" class="cell" data-index="5" aria-label="Cell 6"></button>
      <button type="button" class="cell" data-index="6" aria-label="Cell 7"></button>
      <button type="button" class="cell" data-index="7" aria-label="Cell 8"></button>
      <button type="button" class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="actions">
      <button type="button" id="restart" class="btn primary">
        New Game
      </button>

      <button type="button" id="reset-scores" class="btn secondary">
        Reset Scores
      </button>
    </div>

    <footer class="contact">
      <p class="contact-label">Contact</p>

      <a href="mailto:thandraan@gmail.com">
        thandraan@gmail.com
      </a>

      <a href="https://www.linkedin.com/in/anjaneyulu-t"
         target="_blank"
         rel="noopener noreferrer">
        LinkedIn
      </a>
    </footer>

  </main>

  <script src="game.js"></script>
</body>
</html>
